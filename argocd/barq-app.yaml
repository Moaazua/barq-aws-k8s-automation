
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: barq
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Moaazua/barq-aws-k8s-automation.git
    targetRevision: moaaz
    path: k8s/app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
      - Prune=false
