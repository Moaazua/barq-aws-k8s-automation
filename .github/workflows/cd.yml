name: CD (GitOps)

# CI part of the GitOps flow: test -> build/push image -> bump tag in Git.
# ArgoCD (inside the cluster) detects the Git change and deploys it.
on:
  push:
    branches: [main ,habiba , moaaz]
    paths-ignore: ["k8s/**", "docs/**", "argocd/**", "*.md"]

concurrency:
  group: barq-cd
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the new image tag

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/barq-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tag in k8s/app/app-deployment.yaml
        run: |
          NEW="${IMAGE_REPO}:${{ needs.build-push.outputs.tag }}"
          sed -i -E "s|image: .*/barq-app:.*|image: ${NEW}|" k8s/app/app-deployment.yaml
          grep -n "image:" k8s/app/app-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app/app-deployment.yaml
          git commit -m "ci: deploy barq-app ${{ needs.build-push.outputs.tag }}"
          git push
