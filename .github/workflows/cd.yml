
name: CD - GitOps

on:
  push:
    branches: [moaaz]
    paths:
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barq-cd-moaaz
  cancel-in-progress: false

env:
  IMAGE_REPO: ${{ secrets.MOAAZ_DOCKERHUB_USERNAME }}/barq-app

jobs:
  ############################################
  ### JOB 1: TEST ############################
  ############################################
  test:
    if: github.ref == 'refs/heads/moaaz'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Flask Unit Tests
        run: python -m unittest discover -s tests -v

  ############################################
  ### JOB 2: BUILD & PUSH ####################
  ############################################
  build-push:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MOAAZ_DOCKERHUB_USERNAME }}
          password: ${{ secrets.MOAAZ_DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ############################################
  ### JOB 3: UPDATE GIT MANIFEST #############
  ############################################
  update-manifest:
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: moaaz
          persist-credentials: true

      - name: Update Kubernetes Image Tag
        env:
          NEW_IMAGE: ${{ env.IMAGE_REPO }}:${{ needs.build-push.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/app/app-deployment.yaml")
          content = path.read_text()

          pattern = r"(^[ \t]*image:[ \t]*)[^\s]+/barq-app:[^\s]+"
          updated, count = re.subn(
              pattern,
              lambda match: match.group(1) + os.environ["NEW_IMAGE"],
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit("Expected exactly one barq-app image")

          path.write_text(updated)
          print("Updated image:", os.environ["NEW_IMAGE"])
          PY

      - name: Commit and Push Updated Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/app/app-deployment.yaml

          if git diff --cached --quiet; then
            echo "No image change required"
            exit 0
          fi

          git commit -m "gitops: update barq-app image to ${{ needs.build-push.outputs.tag }}"
          git push origin HEAD:moaaz

